<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>

    <!-- Neon Magenta Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Emblem Balloon Box -->
  <g transform="translate(10, 15)">
    <!-- Decorative Frame -->
    <rect x="0" y="0" width="480" height="90" rx="45" fill="rgba(18, 14, 34, 0.75)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Left Balloon Icon -->
    <g transform="translate(30, 22)">
      <path d="M 20 5 C 9 5, 0 14, 0 25 C 0 38, 15 50, 20 54 C 25 50, 40 38, 40 25 C 40 14, 31 5, 20 5 Z" fill="url(#magentaGrad)" />
      <circle cx="14" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
      <path d="M 20 54 Q 18 64, 24 72" stroke="#D4AF37" stroke-width="2" fill="none"/>
    </g>

    <!-- Main Text: TU LOGO AQUÍ -->
    <text x="250" y="46" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="url(#goldGrad)" filter="url(#glow)">
      ✦ TU LOGO AQUÍ ✦
    </text>

    <!-- Subtitle: DECORACIÓN DE EVENTOS DE LUJO -->
    <text x="250" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#E2C4FF">
      DECORACIÓN DE EVENTOS DE LUJO
    </text>
  </g>
</svg>
