<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Pink Gradients -->
    <linearGradient id="pinkMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EE2" />
      <stop offset="35%" stop-color="#E855B5" />
      <stop offset="70%" stop-color="#C85BA3" />
      <stop offset="100%" stop-color="#7A2260" />
    </linearGradient>
    
    <linearGradient id="pinkHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFD6F3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E855B5" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="turquoiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80FFEA" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B49F" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D9FF" />
      <stop offset="50%" stop-color="#D8B4F8" />
      <stop offset="100%" stop-color="#9B5DE5" />
    </linearGradient>

    <filter id="metallicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#5A1A46" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON GROUP: Metallic Pink Balloon Dog -->
  <g id="balloonDogIcon" transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- Dog Body & Legs Back Layer -->
    <!-- Back Leg Left -->
    <rect x="34" y="65" width="12" height="28" rx="6" fill="url(#pinkMetallic)" transform="rotate(15 34 65)"/>
    <!-- Back Leg Right -->
    <rect x="68" y="65" width="12" height="28" rx="6" fill="url(#pinkMetallic)" transform="rotate(-15 68 65)"/>
    
    <!-- Front Leg Left -->
    <rect x="22" y="65" width="11" height="26" rx="5.5" fill="url(#pinkMetallic)" transform="rotate(-8 22 65)"/>
    <!-- Front Leg Right -->
    <rect x="80" y="65" width="11" height="26" rx="5.5" fill="url(#pinkMetallic)" transform="rotate(8 80 65)"/>

    <!-- Tail Balloon Twist -->
    <ellipse cx="14" cy="52" rx="7" ry="11" fill="url(#pinkMetallic)" transform="rotate(-40 14 52)"/>
    <circle cx="8" cy="42" r="5" fill="url(#pinkMetallic)"/>

    <!-- Main Body Torso Balloon Twist -->
    <rect x="28" y="50" width="56" height="20" rx="10" fill="url(#pinkMetallic)"/>
    <!-- Body Glossy Highlight -->
    <rect x="32" y="52" width="48" height="6" rx="3" fill="url(#pinkHighlight)"/>

    <!-- Neck Balloon Twist -->
    <rect x="70" y="28" width="18" height="30" rx="9" fill="url(#pinkMetallic)" transform="rotate(-25 70 28)"/>
    
    <!-- Head Balloon Twist -->
    <ellipse cx="82" cy="22" rx="16" ry="11" fill="url(#pinkMetallic)" transform="rotate(-10 82 22)"/>
    <!-- Head Gloss Highlight -->
    <ellipse cx="80" cy="18" rx="10" ry="4" fill="url(#pinkHighlight)" transform="rotate(-10 80 18)"/>

    <!-- Snout / Nose Balloon Twist -->
    <ellipse cx="98" cy="24" rx="10" ry="8" fill="url(#pinkMetallic)"/>
    <circle cx="107" cy="24" r="3" fill="url(#turquoiseGrad)"/> <!-- Shiny little nose twist -->

    <!-- Ears Balloon Twist -->
    <ellipse cx="68" cy="12" rx="7" ry="16" fill="url(#pinkMetallic)" transform="rotate(-30 68 12)"/>
    <ellipse cx="78" cy="10" rx="7" ry="16" fill="url(#pinkMetallic)" transform="rotate(-10 78 10)"/>

    <!-- Decorative Stars/Sparkles around Dog -->
    <path d="M 10 20 Q 10 25 5 25 Q 10 25 10 30 Q 10 25 15 25 Q 10 25 10 20 Z" fill="url(#turquoiseGrad)" filter="url(#metallicGlow)"/>
    <path d="M 105 55 Q 105 60 100 60 Q 105 60 105 65 Q 105 60 110 60 Q 105 60 105 55 Z" fill="url(#violetGrad)" filter="url(#metallicGlow)"/>
    <circle cx="112" cy="14" r="2.5" fill="#FFF"/>
  </g>

  <!-- BRAND NAME & TAGLINE TYPOGRAPHY -->
  <g transform="translate(135, 10)">
    <!-- Main Name: NANCY GARCÍA -->
    <text x="0" y="48" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="38" letter-spacing="1.5" fill="#FFFFFF" filter="url(#softShadow)">
      NANCY <tspan fill="url(#pinkMetallic)">GARCÍA</tspan>
    </text>

    <!-- Subtitle Decorative Line -->
    <line x1="0" y1="62" x2="360" y2="62" stroke="url(#turquoiseGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="180" cy="62" r="3.5" fill="url(#pinkMetallic)" />

    <!-- Tagline: DECORACIÓN · GLOBOS · DETALLES -->
    <text x="0" y="88" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="url(#violetGrad)">
      DECORACIÓN <tspan fill="url(#turquoiseGrad)">·</tspan> GLOBOS <tspan fill="url(#turquoiseGrad)">·</tspan> DETALLES
    </text>
  </g>
</svg>
