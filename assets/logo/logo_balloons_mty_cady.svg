<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="magentaNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    
    <linearGradient id="goldMetallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Emblem (3D Glossy Balloon Cluster) -->
  <g transform="translate(10, 15)">
    <!-- Main Balloon -->
    <path d="M 45 10 C 65 10, 80 25, 80 50 C 80 75, 60 95, 45 95 C 30 95, 10 75, 10 50 C 10 25, 25 10, 45 10 Z" fill="url(#magentaNeonGrad)" filter="url(#neonGlow)"/>
    <!-- Balloon Glare -->
    <ellipse cx="32" cy="30" rx="6" ry="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 32 30)" />
    <!-- Balloon Knot -->
    <polygon points="41,95 49,95 45,102" fill="#FF007F"/>
    <!-- Ribbon String -->
    <path d="M 45 102 Q 52 112 40 122 T 48 132" fill="none" stroke="url(#goldMetallicGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small Secondary Gold Balloon -->
    <path d="M 72 40 C 84 40, 93 50, 93 65 C 93 80, 81 92, 72 92 C 63 92, 51 80, 51 65 C 51 50, 60 40, 72 40 Z" fill="url(#goldMetallicGrad)" opacity="0.9"/>
    <ellipse cx="64" cy="52" rx="3.5" ry="7" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 64 52)"/>
  </g>

  <!-- Brand Typography -->
  <!-- "BALLOONS" -->
  <text x="115" y="55" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">BALLOONS</text>

  <!-- "MTY CADY" -->
  <text x="115" y="92" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" letter-spacing="3" fill="url(#magentaNeonGrad)">MTY CADY</text>

  <!-- Subtitle: "Damariss Huerta" -->
  <text x="117" y="115" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="16" letter-spacing="2" fill="url(#goldMetallicGrad)">Por Damariss Huerta</text>
</svg>
